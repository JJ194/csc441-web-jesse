<body>

    <!-- Class 13: Step 2: Navigation -->
    <nav>
        <ul>
            <!-- Lab 13: Task 1:-->
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="books.html">Books & Movies</a></li>
            <!-- Class 16: Step 1a: The contact link -->
            <li><a href="contact.html" class="current">Contact</a></li>
            <!-- Class 15: Step 3: The themeing button -->
            <li><button id="theme-toggle" type="button">Dark</button></li>
        </ul>
    </nav>

    <!-- Class 11: Step 2: The page -->
    <header>
        <!-- Class 12: Step 3: An image -->
        <!-- Lab 12: Task 1: Group the text so it stacks up beside the photo-->
        <img src="images/me.jpg" alt="Portrait of Jesse Jordan" class="portrait">
        <div>
            <h1>Contact Info</h1>
            <p>I can make your website look great! Just give me a call!</p>
        </div>
    </header>

    <main>
        <!-- Class 16: Step 2: A form -->
         <form id="contact-form">
            <p>
                <label for="name">Name</label>
                <input id ="name" name="name" type="text" required>
            </p>

            <p>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </p>

            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </p>

            <button type="submit">Send</button>
            </form>

            <p id="form-status" role="status"></p>
    </main>

    <!-- Lab 12: Task 3: More things in the footer -->
    <footer>
        <p>CSC 441 - Fall 2026; it's the last class needed!</p>
        <p>©<span id="year"></span> Jesse Jordan</p>
        <!-- Class 15: Step 2: The year, written by JS -->
        <!-- Lab 11: Task 3: A link to my page-->
        <a href="https://github.com/JJ194" target="_blank" rel="noopener">GitHub</a>
        <!-- Lab 15: Task 5: Back to the top -->
        <button id="backTop" type="button">Back to the top</button>
    </footer>

</body>
